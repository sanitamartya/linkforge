services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped

    ports:
      - "127.0.0.1:5433:5432"

    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}

    volumes:
      - linkforge_postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped

    ports:
      - "127.0.0.1:6379:6379"

    command: ["redis-server", "--appendonly", "yes"]

    volumes:
      - linkforge_redis_data:/data

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  migrate:
    build:
      context: .
      target: migrate

    environment:
      DATABASE_URL: ${DATABASE_URL_DOCKER:?Add DATABASE_URL_DOCKER to .env}

    depends_on:
      db:
        condition: service_healthy

    restart: "no"

  api:
    build:
      context: .
      target: runtime

    restart: unless-stopped

    ports:
      - "127.0.0.1:3000:3000"

    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: ${DATABASE_URL_DOCKER:?Add DATABASE_URL_DOCKER to .env}
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:?Add JWT_SECRET to .env}
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:3000}

    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  linkforge_postgres_data:
  linkforge_redis_data:
