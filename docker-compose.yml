services:
  db:
    image: postgres:17-alpine
    container_name: linkforge-db
    restart: unless-stopped

    ports:
      - "127.0.0.1:5433:5432"

    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}

    volumes:
      - linkforge_postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: linkforge-redis
    restart: unless-stopped

    ports:
      - "127.0.0.1:6379:6379"

    command: ["redis-server", "--appendonly", "yes"]

    volumes:
      - linkforge_redis_data:/data

volumes:
  linkforge_postgres_data:
  linkforge_redis_data:
